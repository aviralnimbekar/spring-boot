spring:
  application:
    name: spring-security
  datasource:
    url: jdbc:postgresql://localhost:5432/spring_security
    username: app
    password: app
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
